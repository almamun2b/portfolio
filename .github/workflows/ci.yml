name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  quality:
    name: Typecheck, lint, format, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Throwaway values for the admin e2e tests; the build itself needs none.
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      AUTH_TRUST_HOST: "true"
      SEED_ADMIN_EMAIL: e2e-admin@example.com
      SEED_ADMIN_NAME: E2E Admin
      SEED_ADMIN_PASSWORD: E2e-admin-pass-123
      E2E_ADMIN_EMAIL: e2e-admin@example.com
      E2E_ADMIN_PASSWORD: E2e-admin-pass-123
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma format --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Migrate and seed the admin account for the e2e tests
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed
      - name: Install Chromium for the smoke tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke and admin tests (routes, a11y, redirects, sign-in, users) against the build
        run: pnpm test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Audit dependencies
        # Report-only until the remaining upstream advisories are fixed.
        continue-on-error: true
        run: pnpm audit --audit-level high

  migrations:
    name: Migrations match schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - name: Fail if the schema changed without a migration
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        # A new branch has no "before" commit, and a force push can leave one
        # that is no longer in history; fall back to the last commit then.
        run: |
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            pnpm exec commitlint --last --verbose
          fi
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
